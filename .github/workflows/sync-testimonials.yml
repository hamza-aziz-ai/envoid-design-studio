name: Sync testimonials

# Pulls the studio-approved client reviews out of Supabase and commits them as
# testimonials.json, which the site renders. Nothing here can publish a review:
# the query only ever sees rows a human already approved.

on:
  schedule:
    - cron: '30 0 * * *' # 06:00 IST daily
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-testimonials
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Fetch approved reviews
        env:
          # Repository *variables*, not secrets: both values are public by
          # design and ship inside the mobile app. Row-level security is what
          # protects the data. See MobileApp/supabase/schema.sql.
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: node tools/sync-testimonials.mjs --limit 6

      # A pull request, not a push to main. Two reasons, both load-bearing:
      # a push made with GITHUB_TOKEN does not trigger deploy.yml (GitHub's
      # workflow-loop protection), so the file would land in the repository and
      # never reach the live site; and main requires the Checks status, which
      # github-actions[bot] cannot bypass. Merging the PR is a human push, which
      # does deploy - and puts a person in front of public text one last time.
      - name: Open a pull request if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- testimonials.json; then
            echo "no change"
            exit 0
          fi
          BRANCH=sync/testimonials
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add testimonials.json
          git commit -m "Sync approved client testimonials"
          git push

      # A push made with GITHUB_TOKEN does not trigger other workflows, so the
      # commit above would never reach the live site: testimonials.json would
      # sit in the repository looking deployed until some unrelated human push
      # happened. deploy.yml carries workflow_dispatch for exactly this.
      - name: Deploy the change
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet HEAD~1 -- testimonials.json 2>/dev/null; then
            echo "nothing committed, no deploy needed"
          else
            gh workflow run deploy.yml --ref main
          fi --force-with-lease origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH"               --title "Sync approved client testimonials"               --body "Automated: approved reviews pulled from Supabase. Merging publishes them. Review the text before merging - it was written by the public."
          else
            echo "existing PR updated"
          fi
