name: CI/CD

# Checks run on every push and pull request. Only main deploys, and only after
# the checks pass, so a broken page cannot reach the live site. After the
# deployment goes out, the smoke job proves the real origin serves it.

# Documentation is not published: tools/stage.sh strips README.md and docs/
# out of the deployed directory, so a docs-only commit cannot change what the
# site serves and does not need to be built, deployed, smoke tested or tagged.
#
# The filter is on push only. A required status check that never runs reports
# as "Expected" forever, so putting paths-ignore on pull_request would block a
# docs-only pull request from merging rather than speed it up.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. Not cancel-in-progress: cancelling halfway through
# a Pages deployment can leave the site on a partial upload.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Validate HTML
        run: npx --yes html-validate@9 index.html 404.html projects/index.html contact/index.html thanks/index.html services/index.html services/architecture/index.html services/interior-design/index.html services/design-build-turnkey/index.html services/map-approval-ghaziabad/index.html services/vastu/index.html architects-in-ghaziabad/index.html interior-designers-in-ghaziabad/index.html architects-in-noida/index.html

      - name: Parse browser scripts
        run: |
          node --check main.js
          node --check contact.js

      - name: Site checks
        run: python3 tools/check_site.py

      # Serve the site from a root, the way envoiddesign.in serves it, so
      # <base href> in 404.html and every relative URL resolve as they will live.
      - name: Stage a production-shaped copy
        run: bash tools/stage.sh _preview ci

      - name: Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.js

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ github.run_id }}
          path: .lighthouseci
          # .lighthouseci is a dotted directory; without this the upload is empty.
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  deploy:
    name: Deploy to Pages
    needs: check
    # workflow_dispatch included so main can be re-deployed without a commit,
    # for a rollback or after changing something outside the repo.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # Ship the site, not the toolchain that checks it. The commit sha is the
      # cache-busting token, so each deploy invalidates the CSS and JS that
      # Cloudflare holds for four hours in front of Pages.
      - name: Assemble the published site
        run: bash tools/stage.sh _site "${GITHUB_SHA::8}"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    name: Smoke test the live site
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Probe the deployed origin
        run: bash tools/smoke.sh "${{ needs.deploy.outputs.page_url }}"

  release:
    name: Release
    # Only what is deployed AND proven live gets a release, so a tag always
    # names a version of the site that actually served.
    needs: [deploy, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # --generate-notes needs the history to diff against

      - name: Tag and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          # The site carries no version of its own, so releases are dated. The
          # run number keeps several releases on one day distinct and ordered.
          VERSION="v$(date -u +%Y.%m.%d)-${{ github.run_number }}"

          bash tools/stage.sh _site "${GITHUB_SHA::8}"
          ( cd _site && zip -qr "../${VERSION}-site.zip" . )

          gh release create "$VERSION" \
            --title "$VERSION" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --notes-start-tag "$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')" \
            "${VERSION}-site.zip#Deployed site"

          {
            echo "### Released \`$VERSION\`"
            echo ""
            echo "- Live: $PAGE_URL"
            echo "- Release: $(gh release view "$VERSION" --json url --jq .url)"
          } >> "$GITHUB_STEP_SUMMARY"
